[project]
name = "langgraph-movie-recommender"
version = "0.1.0"
description = "Movie and TV recommender chatbot built with LangGraph"
readme = "README.md"
authors = [
    { name = "Uzer Jamal", email = "uzerjamal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "langchain-core>=1.6.13",
    "langchain-huggingface>=1.2.3",
    "langchain-openrouter>=0.2.9",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic-settings>=2.16.1",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
movie-recommender = "langgraph_movie_recommender.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["langgraph_movie_recommender"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["langgraph_movie_recommender"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
