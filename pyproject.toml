[project]
name = "langgraph-movie-recommender"
version = "0.1.0"
description = "Movie and TV recommender chatbot built with LangGraph"
readme = "README.md"
authors = [
    { name = "Uzer Jamal", email = "uzerjamal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.13",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.16",
    "pydantic-settings>=2.16.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
movie-recommender = "langgraph_movie_recommender.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
