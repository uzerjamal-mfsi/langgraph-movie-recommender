services:
  app:
    build:
      context: .
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data

  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
